# Caixa da Casa + Caddy (HTTPS automático com Let's Encrypt).
# Usa a imagem já pronta do GitHub (ghcr.io); só precisas deste ficheiro, do Caddyfile e do .env.
#
# Se já tens outro proxy (Nginx, Traefik, Nginx Proxy Manager…), apaga o serviço "caddy"
# e os volumes caddy-*, e descomenta "ports" no serviço "caixa".

services:
  caixa:
    image: ghcr.io/catuta0/caixa-da-casa:latest
    container_name: caixa-da-casa
    restart: unless-stopped
    env_file: .env
    volumes:
      - caixa-dados:/app/dados
    # ports:
    #   - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2
    container_name: caixa-caddy
    restart: unless-stopped
    depends_on:
      - caixa
    environment:
      - DOMINIO=${DOMINIO}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-dados:/data
      - caddy-config:/config

volumes:
  caixa-dados:
  caddy-dados:
  caddy-config:
