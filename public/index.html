function ir(tab){S.tab=tab;S.confirm=null;S.rendaEdit=null;S.editMorador=null;S.vista=null;S.resumoForm=null;S.verFoto=null;S.fresh=true;render();window.scrollTo({top:0})}
function mudarMes(m){S.mes=m;S.sim=null;S.confirm=null;S.rendaEdit=null;S.ajusteEdit=null;S.fresh=true;render()}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(SO_TES_ACTS.includes(a)&&!gere())return semPermissao();
  if(a==="tab")return ir(b.dataset.t);
  if(a==="filtro"){S.filtro=b.dataset.f;S.verTodos=true;render();const el=document.getElementById("registos");if(el&&b.closest(".numeros"))el.scrollIntoView({behavior:"smooth"});return}
  if(a==="ver-todos"){S.verTodos=true;S.filtro="tudo";return render()}
  if(a==="ver-menos"){S.verTodos=false;S.filtro="tudo";return render()}
  if(a==="sair"){await fetch("/api/sair",{method:"POST",credentials:"same-origin"}).catch(()=>{});location.reload();return}
  if(a==="entrar"){S.vista="entrar";S.fresh=true;render();window.scrollTo({top:0});return}
  if(a==="entrar-voltar"){S.vista=null;S.fresh=true;return render()}
  if(a==="eu-mudar")return escolherEu(null);
  if(a==="sim-repor"){iniciarSim(S.mes);return render()}
  if(a==="sim-repor-pessoas"){recalcSim(true);return render()}
  if(a==="sim-g-rm"){const k=b.dataset.k;S.sim.extras=S.sim.extras.filter(x=>x.k!==k);delete S.sim.v[k];S.sim.linhasCom=S.sim.linhasCom.filter(x=>x!==k);recalcSim(false);return render()}
  if(a==="sim-rec-add"){S.sim.receitas.push({nome:"",valor:0,periodo:"mensal"});render();const el=document.getElementById("sim-r-"+(S.sim.receitas.length-1)+"-nome");if(el)el.focus();return}
  if(a==="sim-rec-rm"){S.sim.receitas.splice(+b.dataset.i,1);recalcSim(false);return render()}
  if(a==="sim-aplicar"){if(!gere())return semPermissao();return aplicarSim()}
  if(a==="arred-mes"){
    const m=S.mes,novo=!regraDe(m).arredondar,dm=JSON.parse(JSON.stringify(S.config.divisaoMes||{}));
    const r=regraDe(m);delete r.ajustes;dm[m]=Object.assign(r,{arredondar:novo});
    if(await gravar(()=>guardarConfig({divisaoMes:dm,arredondarRenda:novo})))toast("ok",novo?"Renda de "+nomeMes(m).toLowerCase()+" arredondada para cima":"Arredondamento desligado em "+nomeMes(m).toLowerCase());
    return;
  }
  if(a==="importar"){document.getElementById("importar-ficheiro").click();return}
  if(a==="morador-editar"){S.editMorador=id;S.reset="f-e-";return render()}
  if(a==="morador-fechar"){S.editMorador=null;return render()}
  if(a==="apagar-morador"||a==="tes-recusar"||a==="tes-retirar"){S.confirm={act:a,id};return render()}
  if(a==="tes-aprovar"){const u=S.tesoureiros.find(x=>x.id===id);if(u&&await gravar(()=>api("PATCH","/api/tesoureiros/"+encodeURIComponent(id),{estado:"ativo"})))toast("ok",u.nome+" é agora tesoureiro");return}
  if(a==="mes")return mudarMes(addMes(S.mes,+b.dataset.n));
  if(a==="hoje")return mudarMes(hojeMes());
  if(a==="ir-mes"){S.mes=b.dataset.m;return ir("resumo")}
  if(a==="desp-add")return addDespesa();
  if(a==="foto-add"){S.anexoAlvo=b.dataset.alvo;anexo.click();return}
  if(a==="foto-tirar"){const l=S.fotos[b.dataset.alvo],i=+b.dataset.i;if(l&&l[i]){try{URL.revokeObjectURL(l[i].url)}catch(e){}l.splice(i,1)}return render()}
  if(a==="foto-ver"){S.verFoto=b.dataset.src;return render()}
  if(a==="foto-fechar"){S.verFoto=null;return render()}
  if(a==="resumo-form"){const f=b.dataset.f;if(f==="conta"&&!gere())return semPermissao();S.resumoForm=S.resumoForm===f?null:f;S.reset=f==="compra"?"f-c-":"f-k-";render();const el=document.getElementById(f==="compra"?"f-c-desc":"f-k-valor");if(el&&S.resumoForm)el.focus();return}
  if(a==="resumo-fechar"){S.resumoForm=null;return render()}
  if(a==="anular"||a==="reemb"||a==="desp-rm"){S.confirm={act:a,id};return render()}
  if(a==="conf-nao"){S.confirm=null;return render()}
  if(a==="conf-sim"){
    const c=S.confirm;S.confirm=null;if(!c)return;
    if(c.act==="desp-rm"){const lista=despesas().map(d=>d.id===c.id?Object.assign({},d,{removida:true}):Object.assign({},d)),d=lista.find(x=>x.id===c.id);
      if(d&&await gravar(()=>guardarConfig({despesas:lista}),()=>{S.config.despesas=lista}))toast("ok","Despesa «"+d.nome+"» removida");return}
    if(c.act==="apagar-morador"){const r=S.moradores.find(x=>x.id===c.id);if(r&&await gravar(()=>api("DELETE","/api/pessoas/"+encodeURIComponent(r.id))))toast("ok",r.nome+" apagado");return}
    if(c.act==="tes-recusar"){const u=S.tesoureiros.find(x=>x.id===c.id);if(u&&await gravar(()=>api("DELETE","/api/tesoureiros/"+encodeURIComponent(u.id))))toast("ok","Pedido de "+u.nome+" recusado");return}
    if(c.act==="tes-retirar"){const u=S.tesoureiros.find(x=>x.id===c.id);if(u&&await gravar(()=>api("PATCH","/api/tesoureiros/"+encodeURIComponent(u.id),{estado:"bloqueado"}))){toast("ok",u.nome+" deixou de ser tesoureiro");if(S.me&&u.id===S.me.id)setTimeout(()=>location.reload(),900)}return}
    const x=allMovs().find(y=>y.id===c.id);if(!x)return render();
    if(c.act==="anular"&&!podeAnular(x))return semPermissao();
    if(c.act!=="anular"&&!gere())return semPermissao();
    if(c.act==="anular"){if(await patchMov(x,{anulado:true}))toast("ok","Registo anulado")}
    else if(await patchMov(x,{reembolsado:true}))toast("ok","Marcado como pago em dinheiro");
    return;
  }
  if(a==="renda-abrir"){S.rendaEdit=id;S.reset="f-r-";render();const el=document.getElementById("f-r-valor");if(el)el.focus();return}
  if(a==="renda-fechar"){S.rendaEdit=null;return render()}
  if(a==="ajuste-abrir"){S.ajusteEdit=id;S.reset="f-a-";render();const el=document.getElementById("f-a-valor");if(el){el.focus();el.select()}return}
  if(a==="ajuste-fechar"){S.ajusteEdit=null;return render()}
  if(a==="ajuste-rm"){
    const aj=JSON.parse(JSON.stringify(S.config.ajustesMes||{}));if(aj[S.mes]){delete aj[S.mes][id];if(!Object.keys(aj[S.mes]).length)delete aj[S.mes]}
    if(await gravar(()=>guardarConfig({ajustesMes:aj}),()=>{S.config.ajustesMes=aj})){S.ajusteEdit=null;toast("ok","Voltou ao cálculo automático")}
    return;
  }
  if(a==="senhorio"){
    const t=valorSenhorio(S.mes);if(!t)return;
    if(await addMov({tipo:"conta",mes:S.mes,data:dataDefault(),cent:t,categoria:"Renda da casa",descricao:"Pagamento ao senhorio",morador:"",moradorNome:"",pagoPor:"fundo",reembolsado:false}))toast("ok","Pagamento ao senhorio registado");
    return;
  }
  if(a==="exportar")return exportar(b.dataset.q);
});

document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.verFoto){S.verFoto=null;render()}});
const anexo=document.getElementById("anexo");
anexo.addEventListener("change",async()=>{
  const files=[...anexo.files];anexo.value="";const alvo=S.anexoAlvo;S.anexoAlvo=null;
  if(!files.length||!alvo)return;
  const bons=files.filter(f=>f.type.startsWith("image/")||f.type==="application/pdf");
  if(bons.length<files.length)toast("err","Só dá para juntar fotos ou PDF.");
  if(!bons.length)return;
  if(alvo.startsWith("mov:")){
    const x=allMovs().find(y=>y.id===alvo.slice(4));if(!x||S.saving)return;
    S.saving=true;schedule();
    let novas;try{novas=await enviarFotos(bons)}catch(e){erroFoto(e);return}finally{S.saving=false;schedule()}
    if(await patchMov(x,{fotosNovas:novas.map(f=>f.id)}))toast("ok","Talão juntado");
    return;
  }
  const l=S.fotos[alvo];if(!l)return;
  bons.slice(0,4-l.length).forEach(f=>l.push({file:f,url:URL.createObjectURL(f),pdf:f.type==="application/pdf"}));
  schedule();
});

document.getElementById("importar-ficheiro").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  let dados;try{dados=JSON.parse(await f.text())}catch(err){return toast("err","Esse ficheiro não é um .json válido.")}
  let r;
  if(await gravar(async()=>{r=await api("POST","/api/importar",dados)}))toast("ok",`Importado: ${r.pessoas} pessoas, ${r.movimentos} registos${r.fotos?", "+r.fotos+" fotos":""}.`);
});

/* ---------- export ---------- */
async function exportar(q){
  const cel=s=>{s=String(s==null?"":s);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const itens=allMovs().filter(x=>q==="tudo"||x.mes===S.mes).sort((a,b)=>-ordem(a,b));
  const linhas=[["Data","Mês","Tipo","Descrição","Pessoa","Pago com","Entrada","Saída","Efeito no fundo","Estado"].join(";")];
  itens.forEach(x=>{const ent=x.tipo==="renda"||(x.tipo==="fundo"&&x.sentido==="entrada");
    const pago=x.tipo==="compra"||x.tipo==="conta"?(x.pagoPor==="fundo"?"fundo":"bolso"+(x.reembolsado?" (pago em dinheiro)":" (descontado na renda de "+nomeMes(x.mes).toLowerCase()+")")):"";
    linhas.push([x.data,x.mes,{compra:"Compra",conta:"Conta",renda:"Renda",fundo:"Fundo"}[x.tipo],descMov(x),x.moradorNome||"",pago,ent?eurNum(x.cent):"",ent?"":eurNum(x.cent),eurNum(efeito(x)),x.anulado?"anulado":"válido"].map(cel).join(";"))});
  const nome=(q==="tudo"?"caixa-da-casa-tudo":"caixa-da-casa-"+S.mes)+".csv";
  const url=URL.createObjectURL(new Blob(["\ufeff"+linhas.join("\r\n")],{type:"text/csv;charset=utf-8"}));
  const a=document.createElement("a");a.href=url;a.download=nome;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

/* ---------- arranque: dados do servidor (sem login) e entrada dos tesoureiros ---------- */
function mostrar(html){app.innerHTML=`<div class="entrada">${html}</div>`}
async function carregar(){
  const r=await api("GET","/api/estado");
  S.me=r.eu;S.autor=r.autor;S.tes=!!(S.me&&S.me.estado==="ativo");
  S.moradores=r.pessoas||[];
  S.tesoureiros=r.tesoureiros||[];
  S.names={};S.tesoureiros.forEach(u=>{S.names[u.id]=u.nome});
  if(S.me)S.names[S.me.id]=S.me.nome;
  S.config=Object.assign({},DEF,r.config||{},{_existe:!!(r.config&&Object.keys(r.config).length)});
  S.movs={todos:r.movimentos||[]};
  if(S.me&&S.vista==="entrar")S.vista=null;
  document.title=(S.config.nome||DEF.nome)+" · Caixa da Casa";
  schedule();
}
let carregarT=0;
function ouvir(){
  if(!window.EventSource)return setInterval(()=>carregar().catch(()=>{}),30000);
  const es=new EventSource("/api/eventos");
  es.onmessage=()=>{clearTimeout(carregarT);carregarT=setTimeout(()=>carregar().catch(()=>{}),300)};
  es.onerror=()=>{};
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)carregar().catch(()=>{})});
}
function vistaEntrar(){
  const p=S.pub||{},haTes=S.tesoureiros.some(u=>u.estado==="ativo");
  return `<div class="entrada"><div class="card entrada-card"><div class="eyebrow">${h(S.config.nome||p.nomeCasa||DEF.nome)}</div><h1>Entrar como tesoureiro</h1>
    <p>Para ver as contas e registar compras não precisas de conta. Só os tesoureiros entram, para gerir rendas, contas, fundo de maneio e definições.</p>
    <p>${haTes?"Depois de entrares, outro tesoureiro tem de te aprovar.":"Ainda não há nenhum tesoureiro: quem entrar primeiro fica logo tesoureiro."}</p>
    <div id="g-botao" class="g-botao">${p.googleClientId?'<span class="muted">A carregar o botão do Google…</span>':'<span class="muted">O servidor ainda não tem o login do Google configurado (falta GOOGLE_CLIENT_ID).</span>'}</div>
    ${p.devLogin?`<form data-form="dev" class="grid dev" autocomplete="off"><div class="hint" style="grid-column:1/-1">Login de teste (só neste computador)</div>
      <label class="fld"><span>Email</span><input id="d-email" type="email" required></label>
      <label class="fld"><span>Nome</span><input id="d-nome"></label>
      <div><button class="btn" type="submit">Entrar para testar</button></div></form>`:""}
    <div class="form-foot"><button class="btn" data-act="entrar-voltar">← Voltar</button></div></div></div>`;
}
let gisIniciado=false;
async function montarGoogle(){
  const p=S.pub||{};if(!p.googleClientId)return;
  for(let i=0;i<100&&!(window.google&&google.accounts&&google.accounts.id);i++)await new Promise(r=>setTimeout(r,100));
  const el=document.getElementById("g-botao");if(!el||el.dataset.pronto)return;
  if(!(window.google&&google.accounts&&google.accounts.id)){el.innerHTML='<span class="muted">Não foi possível carregar o login do Google. Verifica a ligação e recarrega a página.</span>';return}
  if(!gisIniciado){
    google.accounts.id.initialize({client_id:p.googleClientId,callback:async r=>{
      try{await api("POST","/api/entrar/google",{credential:r.credential});location.reload()}
      catch(err){toast("err",err.message||"Não foi possível entrar")}
    }});
    gisIniciado=true;
  }
  el.innerHTML="";el.dataset.pronto="1";
  google.accounts.id.renderButton(el,{theme:"outline",size:"large",shape:"pill",text:"continue_with",locale:"pt-PT"});
}
async function arranque(){
  try{S.pub=await api("GET","/api/publico")}catch(e){S.pub={nomeCasa:DEF.nome,googleClientId:"",devLogin:false}}
  try{await carregar()}catch(e){return mostrar(`<div class="card entrada-card"><h1>Sem ligação</h1><p>Não foi possível falar com o servidor. Recarrega a página daqui a pouco.</p></div>`)}
  S.loading=false;S.fresh=true;render();
  ouvir();
}

render();
arranque();
})();
</script>
