<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2A4F86">
<title>Caixa da Casa</title>
<script src="https://accounts.google.com/gsi/client" async></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  --bg:#EDF2EE; --surface:#FFFFFF; --surface2:#F5F8F5; --ink:#1B2521; --muted:#57665F; --line:#D2DCD5; --rule:#E4EBE6;
  --accent:#2A4F86; --accent-ink:#FFFFFF; --accent-soft:#E2E9F4;
  --good:#2B7746; --good-soft:#E0F0E5; --warn:#955F07; --warn-soft:#FAEFD9; --bad:#B42318; --bad-soft:#FBE5E2;
  --track:#DCE4DE; --shadow:0 1px 2px rgba(20,40,30,.06),0 4px 16px rgba(20,40,30,.05);
  --f-display:"Familjen Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101613; --surface:#18201C; --surface2:#1D2622; --ink:#E2E9E5; --muted:#97A59E; --line:#2D3833; --rule:#242E2A;
    --accent:#8FB1E8; --accent-ink:#0D1829; --accent-soft:#1D2A3F;
    --good:#6DC98F; --good-soft:#15301F; --warn:#E2AD55; --warn-soft:#33270F; --bad:#F08A7E; --bad-soft:#3A1A16;
    --track:#28332E; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101613; --surface:#18201C; --surface2:#1D2622; --ink:#E2E9E5; --muted:#97A59E; --line:#2D3833; --rule:#242E2A;
  --accent:#8FB1E8; --accent-ink:#0D1829; --accent-soft:#1D2A3F;
  --good:#6DC98F; --good-soft:#15301F; --warn:#E2AD55; --warn-soft:#33270F; --bad:#F08A7E; --bad-soft:#3A1A16;
  --track:#28332E; --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:700;line-height:1.15}
h2{font-size:20px;font-weight:600}
h3{font-size:16px;font-weight:600}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:16px}
.brand{display:grid;gap:2px}
.monthnav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.monthnav .mlabel{font-family:var(--f-display);font-weight:600;font-size:18px;min-width:9.5em;text-align:center}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;line-height:1}
.iconbtn:hover{border-color:var(--accent)}
.linkbtn{background:none;border:none;color:var(--accent);cursor:pointer;padding:4px 6px;font-weight:600;font-size:13.5px}
.linkbtn:hover{text-decoration:underline}

/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:none;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

.stack{display:grid;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}

/* banners */
.banner{border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:16px;border:1px solid}
.banner.info{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:10;padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toast.ok{background:var(--good);color:var(--surface)}
.toast.err{background:var(--bad);color:#fff}

/* plafond hero */
.hero{display:grid;gap:14px}
.hero-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 24px}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,7vw,48px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big small{font-size:16px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px}
.big.over{color:var(--bad)}
.bar{position:relative;height:14px;border-radius:7px;background:var(--track)}
.bar .fill{position:absolute;inset:0 auto 0 0;border-radius:7px;background:var(--accent)}
.bar .fill.warn{background:var(--warn)}
.bar .fill.bad{background:var(--bad)}
.bar .pace{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);opacity:.55;border-radius:1px}
.bar-legend{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 16px;font-size:13.5px;color:var(--muted)}
.bar-legend b{color:var(--ink);font-weight:600}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:720px){.stats{grid-template-columns:1fr}}
.stat{display:grid;gap:4px;align-content:start}
.stat .val{font-family:var(--f-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .sub{font-size:13.5px;color:var(--muted)}
.stat button{justify-self:start;margin-left:-6px}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.neutral{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}

/* movement list */
.movs{list-style:none;margin:0;padding:0}
.mov{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:11px 0;border-top:1px solid var(--rule)}
.mov:first-child{border-top:none}
.mov-desc{font-weight:600}
.mov-meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center}
.mov-val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;font-weight:500;white-space:nowrap}
.mov-val.in{color:var(--good)}
.mov-actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mov.anulado .mov-desc,.mov.anulado .mov-val{text-decoration:line-through;color:var(--muted)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px;background:var(--surface2);border:1px solid var(--line);padding:6px 10px;border-radius:10px}
.empty{color:var(--muted);padding:12px 0;font-size:14px}
.total-row{display:flex;justify-content:space-between;gap:12px;padding-top:12px;margin-top:4px;border-top:2px solid var(--line);font-weight:600}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.55;cursor:default}

/* forms */
.form h3{margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.fld{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.fld.wide{grid-column:1/-1}
.fld input,.fld select{width:100%;min-width:0;font-size:15px;font-weight:400;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;height:42px}
.fld input:focus,.fld select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink);font-weight:500;cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
.form-foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:14px}
.hint{font-size:13px;color:var(--muted)}

/* tables */
.tablewrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--rule);vertical-align:middle}
td.r,th.r{text-align:right}
td.num{white-space:nowrap}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface2)}
tr.sel td{background:var(--accent-soft)}
tfoot td{font-weight:600;border-top:2px solid var(--line);border-bottom:none}
.ledger td.num{font-size:13.5px}
.ledger .in{color:var(--good)}
.ledger .open td{color:var(--muted);font-style:italic}

.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.checklist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.checklist li{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:inline-grid;place-items:center;font-size:12px;flex:none}
.dot.done{background:var(--good);border-color:var(--good);color:var(--surface)}
.people{display:grid;gap:8px;margin-top:8px}
.person{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.loading{padding:48px 0;text-align:center;color:var(--muted)}
.prev input{width:110px;max-width:100%;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;height:36px}
.prev input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.prev input:disabled{background:transparent;border-color:transparent}
.prev td{padding-block:6px}
td.c,th.c{text-align:center}
.linha-nome{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rm{border:none;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;width:26px;height:26px;border-radius:6px;flex:none}
.rm:hover{color:var(--bad);background:var(--bad-soft)}
.add-desp{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end;margin-top:12px}
.add-desp .fld{flex:1 1 220px;max-width:360px}
.prev .prev-com{width:18px;height:18px;accent-color:var(--accent)}
.prev-res{display:flex;flex-direction:column;gap:6px;margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-size:15px}
.prev-cada{font-family:var(--f-display);font-size:22px;color:var(--accent)}
.tab.sec{font-weight:500;font-size:13.5px}
.tab-sep{flex:none;width:1px;background:var(--line);margin:10px 6px}
.voltar{padding-left:0;margin:-10px 0 12px}
.acoes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.acoes{grid-template-columns:1fr}}
.acao{display:grid;gap:2px;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:var(--shadow)}
.acao b{font-family:var(--f-display);font-size:17px;font-weight:600}
.acao span{font-size:13px;color:var(--muted)}
.acao:hover{border-color:var(--accent)}
.acao.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.acao.primary span{color:var(--accent-ink);opacity:.85}
.acao[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:3px}
.fotos-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.thumb{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface2);flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-pdf{display:grid;place-items:center;width:100%;height:100%;font-size:12px;font-weight:700;color:var(--muted)}
.thumb-x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1;font-size:14px}
.mov-fotos{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.thumb-btn{width:44px;height:44px;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:zoom-in;background:var(--surface2)}
.thumb-btn img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-pdf.sm{width:44px;height:44px;border:1px solid var(--line);border-radius:8px;text-decoration:none}
.lightbox{position:fixed;inset:0;z-index:20;background:rgba(10,14,12,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.lightbox img{max-width:100%;max-height:calc(100% - 64px);object-fit:contain;border-radius:8px;background:#fff}
.filtros{display:flex;gap:6px;flex-wrap:wrap}
.filtro{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;font-weight:600;color:var(--muted)}
.filtro:hover{border-color:var(--accent)}
.filtro[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sub-sec{font-size:17px;margin-top:8px;color:var(--muted)}
.detalhes summary{cursor:pointer;font-weight:600;color:var(--accent)}
.detalhes .card{border:none;box-shadow:none;padding:0;margin-top:14px;background:none}
.hero-acoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn.grande{padding:12px 18px;font-size:15px;border-radius:12px;flex:1 1 170px}
.btn[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.eu-pick{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.eu-pick select{font-size:15px;height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);min-width:0;max-width:100%}
.eu-num{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:4px}
.eu-num span{display:block;font-size:12.5px;color:var(--muted)}
.eu-num b{display:block;font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
@media (max-width:420px){.eu-num b{font-size:19px}}
.eu-links{display:flex;gap:4px 14px;flex-wrap:wrap;margin-top:10px;margin-left:-6px}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
@media (max-width:560px){.nums{grid-template-columns:1fr}}
.num-item{text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:grid;gap:1px;color:var(--ink)}
.num-item:hover{border-color:var(--accent)}
.num-item span{font-size:12.5px;color:var(--muted)}
.num-item b{font-family:var(--f-display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.num-item small{font-size:12px;color:var(--muted)}
.ajuste-form{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.ajuste-form input{width:90px;height:34px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);text-align:right;font-family:var(--f-mono)}
.linkbtn.mini{font-size:12.5px;padding:0 2px}
.l-short{display:none}
/* telemóvel: tabelas viram cartões e os separadores ficam numa barra em baixo */
@media (max-width:640px){
  h1{font-size:23px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;margin:0;background:var(--surface);border-top:1px solid var(--line);border-bottom:none;padding:0 4px env(safe-area-inset-bottom,0px);gap:0;overflow:visible;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  .tab,.tab.sec{flex:1 1 0;min-width:0;padding:13px 2px 11px;font-size:12.5px;font-weight:600;margin:0;border-bottom:none;border-top:2px solid transparent;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tab[aria-selected="true"]{border-top-color:var(--accent);border-bottom-color:transparent}
  .tab-sep,.l-long,.voltar{display:none}
  .l-short{display:inline}
  .wrap{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
  .card{padding:15px}
  .tablewrap{overflow:visible;margin-inline:0}
  .tablewrap table,.tablewrap tbody,.tablewrap tfoot,.tablewrap tr,.tablewrap td{display:block;width:100%}
  .tablewrap thead{display:none}
  .tablewrap tr{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px;background:var(--surface)}
  .tablewrap tfoot tr{background:var(--surface2)}
  .tablewrap td,.tablewrap tfoot td{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px 12px;border:none;padding:5px 0;text-align:right;white-space:normal}
  .tablewrap td::before{content:attr(data-label);color:var(--muted);font-size:12.5px;font-weight:600;text-align:left;font-family:var(--f-body);font-style:normal}
  .tablewrap td:not([data-label])::before{display:none}
  .tablewrap td:empty{display:none}
  .tablewrap td:first-child{font-size:16px;text-align:left;justify-content:flex-start;padding:2px 0 8px;margin-bottom:4px;border-bottom:1px solid var(--rule)}
  .tablewrap td:first-child::before{display:none}
  .tablewrap tr.clickable:hover td{background:none}
  .tablewrap tr.sel{border-color:var(--accent)}
  .ledger td:first-child{font-size:12.5px;color:var(--muted);border:none;margin:0;padding:0}
  .ledger td:nth-child(2){font-size:15px;font-weight:600;text-align:left;justify-content:flex-start;padding:2px 0 8px;margin-bottom:4px;border-bottom:1px solid var(--rule)}
  .ledger td:nth-child(2)::before{display:none}
  .ledger .open td{font-style:normal}
  .prev td:first-child{font-size:15px}
  .ajuste-form,.tablewrap td form{justify-content:flex-end;width:100%}
  .section-head{align-items:flex-start}
}
.entrada{min-height:70vh;display:grid;place-items:center}
.entrada-card{max-width:460px;width:100%;display:grid;gap:10px}
.entrada-card p{margin:0;color:var(--muted);line-height:1.55}
.g-botao{min-height:44px;display:flex;align-items:center;margin-top:6px}
.dev{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.quem{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);margin-top:4px}
.quem .linkbtn{padding:2px 4px}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;background:var(--surface2);border:1px solid var(--line)}
.avatar.sm{width:22px;height:22px}
.avatar.vazio{display:inline-grid;place-items:center;font-weight:700;color:var(--muted);font-family:var(--f-display)}

<body>
<div class="wrap" id="app"><div class="loading">A abrir o livro de caixa…</div></div>
<div id="toast" hidden></div>
<input type="file" id="anexo" accept="image/*,application/pdf" multiple hidden>
<input type="file" id="importar-ficheiro" accept="application/json,.json" hidden>

<script>
(function(){
"use strict";
const DEF={nome:"Casa comunitária",plafond:40000,plafondMes:{},rendaMes:{},previsaoMes:{},fundoInicial:0,rendasNoFundo:true,anoInicio:null};
/* despesas da casa: editáveis na calculadora da renda; cada uma (menos a reserva) é também um tipo de conta */
const DESPESAS_DEF=[{id:"renda",nome:"Renda ao senhorio",cat:"Renda da casa"},{id:"agua",nome:"Água"},{id:"luz",nome:"Luz"},{id:"gas",nome:"Gás"},{id:"internet",nome:"Internet"},{id:"condominio",nome:"Condomínio"},{id:"seguro",nome:"Seguro"},{id:"outra",nome:"Outras contas",cat:"Outra"},{id:"reserva",nome:"Reserva para o fundo de maneio",semConta:true}];
const despesas=()=>S.config.despesas||DESPESAS_DEF;
const catDe=d=>d.cat||d.nome;
function tiposConta(){const t=despesas().filter(d=>!d.removida&&!d.semConta).map(catDe);if(!t.includes("Outra"))t.push("Outra");return t}
function nomeLinha(k){if(k==="plafond")return "comida";const d=despesas().find(x=>x.id===k);return d?d.nome.toLowerCase():k}
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const TABS=[["resumo","Resumo","Resumo"],["rendas","Rendas","Rendas"],["simulacao","Simulação","Simular"],["fundo","Fundo de maneio","Fundo"],["historico","Histórico","Histórico"],["definicoes","Definições","Definições"]];

const pad=n=>String(n).padStart(2,"0");
function hoje(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
const hojeMes=()=>hoje().slice(0,7);
function addMes(m,n){let y=+m.slice(0,4),mm=+m.slice(5,7)+n;while(mm>12){mm-=12;y++}while(mm<1){mm+=12;y--}return y+"-"+pad(mm)}
function nomeMes(m){return MESES[+m.slice(5,7)-1].replace(/^./,c=>c.toUpperCase())+" "+m.slice(0,4)}
function nomeMesCurto(m){return MESES[+m.slice(5,7)-1].slice(0,3)+" "+m.slice(2,4)}
function diasNoMes(m){return new Date(+m.slice(0,4),+m.slice(5,7),0).getDate()}
function dataCurta(d){if(!d)return"";return +d.slice(8,10)+" "+MESES[+d.slice(5,7)-1].slice(0,3)}
const EUR=new Intl.NumberFormat("pt-PT",{style:"currency",currency:"EUR"});
const eur=c=>EUR.format((c||0)/100);
const eurNum=c=>((c||0)/100).toFixed(2).replace(".",",");
function h(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function parseValor(s){s=String(s||"").trim().replace(/[€\s]/g,"");if(!s)return null;if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const n=Number(s);if(!isFinite(n)||n<=0)return null;return Math.round(n*100)}
const sum=a=>a.reduce((t,x)=>t+(x.cent||0),0);

const S={me:null,autor:null,pub:null,vista:null,tesoureiros:[],editMorador:null,canWrite:true,loading:true,saving:false,
  config:Object.assign({},DEF),moradores:[],movs:{},mes:hojeMes(),tab:"resumo",
  confirm:null,rendaEdit:null,ajusteEdit:null,eu:null,tes:false,detAberto:false,filtro:"tudo",verTodos:false,fotos:{c:[],k:[]},anexoAlvo:null,verFoto:null,resumoForm:null,editMembro:null,names:{},fresh:true,reset:null};
try{S.eu=localStorage.getItem("caixa-eu")||null}catch(e){}
const app=document.getElementById("app");

/* ---------- derived data ---------- */
function allMovs(){let a=[];for(const y in S.movs)a=a.concat(S.movs[y]);return a}
const vivos=()=>allMovs().filter(x=>!x.anulado);
function ordem(a,b){return (b.data||"").localeCompare(a.data||"")||(b.criadoEm||"").localeCompare(a.criadoEm||"")}
function plafondDe(m){const pm=S.config.plafondMes||{};return pm[m]!=null?pm[m]:(S.config.plafond||0)}
function ativoEm(r,m){return (!r.entrada||r.entrada<=m)&&(!r.saida||r.saida>=m)}
function efeito(x){
  if(x.anulado)return 0;
  if(x.tipo==="fundo")return x.sentido==="entrada"?x.cent:-x.cent;
  if(x.tipo==="renda")return S.config.rendasNoFundo?x.cent:0;
  if(x.tipo==="compra"||x.tipo==="conta"){if(x.pagoPor==="fundo"||x.reembolsado)return -x.cent;return 0}
  return 0;
}
function saldoAte(m,vis){vis=vis||vivos();return (S.config.fundoInicial||0)+vis.filter(x=>x.mes<=m).reduce((t,x)=>t+efeito(x),0)}
function stats(m,vis){
  vis=vis||vivos();
  const doMes=vis.filter(x=>x.mes===m);
  const ativos=S.moradores.filter(r=>ativoEm(r,m));
  return {
    compras:sum(doMes.filter(x=>x.tipo==="compra")),
    contas:sum(doMes.filter(x=>x.tipo==="conta")),
    nContas:doMes.filter(x=>x.tipo==="conta").length,
    rendasRec:sum(doMes.filter(x=>x.tipo==="renda")),
    rendasEsp:rendaEfetiva(m)||0,
    plafond:plafondDe(m),
    saldo:saldoAte(m,vis),
    ativos
  };
}
/* renda da casa: um valor total por mês, dividido em partes iguais pelos moradores desse mês */
function rendaTotal(m){const rm=S.config.rendaMes||{};return rm[m]!=null?rm[m]:null}
/* moradores pagam tudo; comensais (só comem cá) pagam a sua parte das despesas escolhidas, ou um valor fixo.
   A regra de cada mês fica guardada quando se define a renda, para os meses passados não mudarem. */
const LINHAS_COM_DEF=["plafond","internet","gas"];
const eComensal=r=>r.tipo==="comensal"||r.tipo==="meio";
const eMeio=r=>r.tipo==="meio";
const nomeTipo=r=>r.tipo==="meio"?"meio comensal":r.tipo==="comensal"?"comensal":"morador";
function regraAtual(){
  const fixos={},comensais=[],meios=[];
  S.moradores.forEach(r=>{if(eComensal(r)){comensais.push(r.id);if(eMeio(r))meios.push(r.id);if(r.valorFixo!=null)fixos[r.id]=r.valorFixo}});
  return {linhas:(S.config.comensalLinhas||LINHAS_COM_DEF).slice(),fixos,comensais,meios,pessoas:S.moradores.map(r=>r.id),arredondar:!!S.config.arredondarRenda};
}
const pessoaInfo=id=>S.moradores.find(x=>x.id===id)||null;
const pessoasCasa=m=>S.moradores;
/* acertos manuais do tesoureiro: valor da parte de uma pessoa num mês */
const ajustesDe=m=>(S.config.ajustesMes||{})[m]||{};
function regraDe(m){
  const d=(S.config.divisaoMes||{})[m];
  const r=d?{linhas:d.linhas||[],fixos:d.fixos||{},comensais:d.comensais||[],meios:d.meios||[],pessoas:d.pessoas||null,arredondar:!!d.arredondar}:regraAtual();
  r.ajustes=ajustesDe(m);return r;
}
function dividir(t,rs,out){dividirPeso(t,rs.map(r=>({id:r.id,w:1})),out)}
/* divide t cêntimos por pesos; os cêntimos que sobram vão um a um pela ordem da lista */
function dividirPeso(t,gs,out){
  const W=gs.reduce((s,g)=>s+g.w,0);if(!W||t<=0)return;
  let dado=0;const bases=gs.map(g=>{const b=Math.floor(t*g.w/W);dado+=b;return b});
  let r=t-dado;gs.forEach((g,i)=>{out[g.id]=(out[g.id]||0)+bases[i]+(r>0?1:0);if(r>0)r--});
}
function divisao(t,v,m,regra){
  regra=regra||regraDe(m);
  const aj=regra.ajustes||{},meios=regra.meios||[];
  const base=S.moradores;
  const todos=base.filter(r=>ativoEm(r,m)).sort((a,b)=>a.nome.localeCompare(b.nome,"pt")||a.id.localeCompare(b.id));
  const isCom=r=>regra.comensais.includes(r.id),isMeio=r=>meios.includes(r.id),peso=r=>isMeio(r)?.5:1;
  const mor=todos.filter(r=>!isCom(r)),com=todos.filter(isCom);
  const comFixo=com.filter(r=>regra.fixos[r.id]!=null),comParte=com.filter(r=>regra.fixos[r.id]==null);
  const out={};let resto=t;const fixos=[],ajustados=[];
  comFixo.forEach(r=>{const f=Math.max(0,Math.min(resto,regra.fixos[r.id]));out[r.id]=f;resto-=f;fixos.push({nome:r.nome,valor:f})});
  const valLinhas=regra.linhas.reduce((s,k)=>s+((v&&v[k])||0),0);
  let P=0,cadaCom=0;
  if(!mor.length){
    const gs=comParte.map(r=>({id:r.id,w:peso(r)})),W=gs.reduce((s,g)=>s+g.w,0);
    dividirPeso(resto,gs,out);cadaCom=W?Math.round(resto/W):0;
  }else{
    P=comParte.length?Math.min(resto,valLinhas):0;
    const gs=mor.map(r=>({id:r.id,w:1})).concat(comParte.map(r=>({id:r.id,w:peso(r)}))),W=gs.reduce((s,g)=>s+g.w,0);
    dividirPeso(P,gs,out);dividir(resto-P,mor,out);
    cadaCom=comParte.length?Math.round(P/W):0;
  }
  /* arredondar para cima: cada pessoa do mesmo tipo paga o mesmo valor, em euros certos; o que sobra vai para o fundo */
  const euros=c=>Math.ceil((c-1e-6)/100)*100;
  let porPeso=0;
  if(regra.arredondar){
    const W=mor.length+comParte.reduce((s,r)=>s+peso(r),0);
    porPeso=mor.length?(comParte.length&&W?P/W:0):(W?resto/W:0);
    const cadaMorExato=mor.length?porPeso+(resto-P)/mor.length:0;
    mor.forEach(r=>{out[r.id]=euros(cadaMorExato)});
    comParte.forEach(r=>{out[r.id]=euros(porPeso*peso(r))});
    cadaCom=euros(porPeso);
  }
  /* acertos à mão: a pessoa passa a pagar esse valor e a renda total do mês ajusta-se (os outros não mudam) */
  const somaBase=todos.reduce((s,r)=>s+(out[r.id]||0),0);
  todos.forEach(r=>{if(aj[r.id]!=null){out[r.id]=aj[r.id];ajustados.push({nome:r.nome,valor:aj[r.id]})}});
  const livresMor=mor.filter(r=>aj[r.id]==null),livresCom=comParte.filter(r=>aj[r.id]==null),dif=0;
  const cadaMor=livresMor.length?Math.round(livresMor.reduce((s,r)=>s+(out[r.id]||0),0)/livresMor.length):0;
  const soma=todos.reduce((s,r)=>s+(out[r.id]||0),0);
  const cc=!livresMor.length&&dif&&livresCom.length?Math.round(livresCom.filter(r=>!isMeio(r)).reduce((s,r)=>s+(out[r.id]||0),0)/Math.max(1,livresCom.filter(r=>!isMeio(r)).length)):cadaCom;
  return {out,nTodos:todos.length,nMor:livresMor.length,nComParte:livresCom.filter(r=>!isMeio(r)).length,nMeio:livresCom.filter(isMeio).length,
    fixos,ajustados,cadaCom:cc,cadaMeio:regra.arredondar?euros(porPeso/2):Math.round(cc/2),cadaMor,linhas:regra.linhas,soma,somaBase,total:t,arredondar:!!regra.arredondar};
}
const _q={};
function divisaoDe(m){if(m in _q)return _q[m];const t=rendaTotal(m);return _q[m]=t?divisao(t,previsaoBase(m,vivos()).v,m):null}
function quotasDe(m){const d=divisaoDe(m);return d?d.out:{}}
/* renda total efetiva: a calculada, mais/menos os acertos à mão do tesoureiro */
function rendaEfetiva(m){const d=divisaoDe(m);return d?d.soma:null}
/* o que vai para o senhorio: a linha "renda ao senhorio" da previsão, se houver */
function valorSenhorio(m){const pv=(S.config.previsaoMes||{})[m];return pv&&pv.renda?pv.renda:rendaTotal(m)}
function textoDivisao(d){
  if(!d.nTodos)return "Não há ninguém na casa neste mês para dividir a renda.";
  const p=[];
  d.ajustados.forEach(x=>p.push(`${h(x.nome)} paga <b>${eur(x.valor)}</b> (acertado pelo tesoureiro)`));
  d.fixos.forEach(x=>p.push(`${h(x.nome)} paga o valor fixo de <b>${eur(x.valor)}</b>`));
  if(d.nComParte||d.nMeio){
    if(!d.nMor){if(d.nComParte)p.push(`cada comensal paga <b>${eur(d.cadaCom)}</b>`);if(d.nMeio)p.push(`cada meio comensal paga <b>${eur(d.cadaMeio)}</b>`)}
    else if(!d.linhas.length)p.push(`os comensais sem valor fixo não pagam nada (não há despesas escolhidas para eles)`);
    else{
      const l=d.linhas.map(nomeLinha).join(", ").replace(/, ([^,]*)$/," e $1");
      if(d.nComParte)p.push(`${d.fixos.length?"cada um dos outros comensais":"cada comensal"} paga a sua parte de ${l}: <b>${eur(d.cadaCom)}</b>`);
      if(d.nMeio)p.push(`cada meio comensal paga metade${d.nComParte?" disso":" da parte de um comensal em "+l}: <b>${eur(d.cadaMeio)}</b>`);
    }
  }
  if(d.nMor)p.push(`cada morador paga <b>${eur(d.cadaMor)}</b>`);
  let s=p.join("; ")+".";s=s.charAt(0).toUpperCase()+s.slice(1);
  if(d.arredondar&&d.somaBase>d.total)s+=` Arredondado para cima: sobram <b>${eur(d.somaBase-d.total)}</b>, que ficam no fundo de maneio.`;
  else if(d.somaBase!==d.total)s+=` <span style="color:var(--bad)">Atenção: a soma das partes (${eur(d.somaBase)}) não bate com a renda calculada (${eur(d.total)}).</span>`;
  return s;
}
/* parte do mês na tabela das rendas; o tesoureiro pode acertar à mão */
function celulaParte(r,d,m){
  const aj=ajustesDe(m)[r.id],acertado=aj!=null;
  if(gere()&&S.ajusteEdit===r.id)return `<form data-form="ajuste" data-id="${h(r.id)}" class="ajuste-form" autocomplete="off">
    <input id="f-a-valor" inputmode="decimal" value="${eurNum(d.parte)}" aria-label="Parte de ${h(r.nome)} este mês">
    <button class="btn small primary" type="submit"${S.saving?" disabled":""}>Guardar</button><button class="btn small" type="button" data-act="ajuste-fechar">Cancelar</button>
    ${acertado?`<button class="linkbtn" type="button" data-act="ajuste-rm" data-id="${h(r.id)}">Voltar ao cálculo automático</button>`:""}</form>`;
  const v=d.parte?eur(d.parte):"—";
  return `${v}${acertado?' <span class="chip warn" title="Valor acertado à mão pelo tesoureiro">acertado</span>':""}${gere()&&rendaTotal(m)?`<br><button class="linkbtn mini" data-act="ajuste-abrir" data-id="${h(r.id)}">Alterar</button>`:""}`;
}
/* antes: o que ficou de meses anteriores (+ em dívida, − pago a mais) */
/* compras/contas pagas do próprio bolso: descontam logo na renda do mês da compra (mesmo que fique negativa), a não ser que o tesoureiro as pague em dinheiro */
const eBolso=x=>(x.tipo==="compra"||x.tipo==="conta")&&x.pagoPor==="bolso";
const creditosDe=(r,vis)=>vis.filter(x=>eBolso(x)&&!x.reembolsado&&x.morador===r.id);
function rendaDe(r,m,vis){
  vis=vis||vivos();
  const pagos=vis.filter(x=>x.tipo==="renda"&&x.morador===r.id),cred=creditosDe(r,vis);
  let antes=0;
  Object.keys(S.config.rendaMes||{}).forEach(k=>{if(k<m)antes+=quotasDe(k)[r.id]||0});
  antes-=sum(pagos.filter(x=>x.mes<m))+sum(cred.filter(x=>x.mes<m));
  const desconto=sum(cred.filter(x=>x.mes===m));
  const parte=quotasDe(m)[r.id]||0,devido=parte+antes-desconto,pago=sum(pagos.filter(x=>x.mes===m)),saldo=devido-pago;
  const falta=Math.max(0,saldo),aFavor=Math.max(0,-saldo);
  let estado;
  if(saldo<=0&&pago>0)estado=["good",aFavor?"Pago, com crédito":"Pago"];
  else if(saldo<=0)estado=aFavor?["good","Com crédito"]:["neutral","Nada a pagar"];
  else if(pago>0)estado=["warn","Parcial"];
  else estado=m<hojeMes()?["bad","Em falta"]:["neutral","Por pagar"];
  return {parte,antes,desconto,devido,pago,falta,aFavor,estado};
}
const nomeMorador=id=>{const r=S.moradores.find(x=>x.id===id);return r?r.nome:""};
function porReembolsar(){
  const lim=addMes(hojeMes(),-1);
  const pend=vivos().filter(x=>eBolso(x)&&!x.reembolsado&&x.mes>=lim);
  const by={};pend.forEach(x=>{const k=x.moradorNome||"Sem nome";(by[k]=by[k]||[]).push(x)});
  return {pend,by};
}

/* ---------- rendering ---------- */
function schedule(){if(!schedule.q){schedule.q=true;requestAnimationFrame(()=>{schedule.q=false;render()})}}
function render(){
  for(const k in _q)delete _q[k];
  const vals={};
  if(!S.fresh)app.querySelectorAll('[id^="f-"]').forEach(el=>{if(S.reset&&el.id.startsWith(S.reset))return;if(S.reset2&&el.id.startsWith(S.reset2))return;vals[el.id]=el.type==="checkbox"?el.checked:el.value});
  const act=document.activeElement,actId=act&&act.id&&!S.fresh?act.id:null;let sel=null;
  try{if(actId&&act.selectionStart!=null)sel=[act.selectionStart,act.selectionEnd]}catch(e){}
  S.fresh=false;S.reset=null;S.reset2=null;
  app.innerHTML=S.loading?'<div class="loading">A abrir o livro de caixa…</div>':page();
  for(const id in vals){const el=document.getElementById(id);if(!el)continue;if(el.type==="checkbox")el.checked=vals[id];else if(el.tagName!=="SELECT"||[...el.options].some(o=>o.value===vals[id]))el.value=vals[id]}
  if(actId){const el=document.getElementById(actId);if(el){el.focus();if(sel)try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
  const quemEl=document.getElementById("f-c-quem");
  if(quemEl&&!quemEl.value&&S.eu&&[...quemEl.options].some(o=>o.value===S.eu))quemEl.value=S.eu;
  rotularTabelas();
  if(S.vista==="entrar")montarGoogle();
  atualizarPrev();
  pedirNomes();
}
function rotularTabelas(){
  app.querySelectorAll(".tablewrap table").forEach(t=>{
    const hs=[...t.querySelectorAll("thead th")].map(th=>th.textContent.trim());
    t.querySelectorAll("tbody tr, tfoot tr").forEach(tr=>{let i=0;[...tr.children].forEach(td=>{if(hs[i])td.setAttribute("data-label",hs[i]);i+=td.colSpan||1})});
  });
}

function page(){
  if(S.vista==="entrar")return vistaEntrar();

  let out=`<header class="top">

/* movement row */
function descMov(x){
  if(x.tipo==="compra")return x.descricao||"Compras";
  if(x.tipo==="conta")return (x.categoria||"Conta")+(x.descricao?" — "+x.descricao:"");
  if(x.tipo==="renda")return "Renda — "+(x.moradorNome||"?");
  if(x.tipo==="fundo")return x.descricao||(x.sentido==="entrada"?"Entrada no fundo":"Saída do fundo");
  return "";
}
function linhaMov(x,opts){
  opts=opts||{};
  if(opts.compacto){
    const ent=x.tipo==="renda"||(x.tipo==="fundo"&&x.sentido==="entrada");
    return `<li class="mov${x.anulado?" anulado":""}"><div><div class="mov-desc">${h(descMov(x))}</div><div class="mov-meta"><span>${dataCurta(x.data)}${x.moradorNome&&x.tipo!=="renda"?" · "+h(x.moradorNome):""}</span>${x.fotos&&x.fotos.length?"<span>· com talão</span>":""}${x.anulado?'<span class="chip bad">anulado</span>':""}</div></div><div class="mov-val${ent?" in":""}">${ent?"+":""}${eur(x.cent)}</div></li>`;
  }
  const meta=[];
  meta.push(dataCurta(x.data));
  if(opts.tipo)meta.push({compra:"Compra",conta:"Conta",renda:"Renda",fundo:"Fundo"}[x.tipo]);
  if(x.tipo==="compra"&&x.moradorNome)meta.push("comprou "+h(x.moradorNome));
  if(x.tipo==="conta"&&x.mes!==(x.data||"").slice(0,7))meta.push("refere-se a "+nomeMesCurto(x.mes));
  if(x.tipo==="renda"&&x.mes!==(x.data||"").slice(0,7))meta.push("renda de "+nomeMesCurto(x.mes));
  let chip="";
  if(x.tipo==="compra"||x.tipo==="conta"){
    if(x.pagoPor==="fundo")meta.push("pago com o fundo");
    else chip=x.reembolsado?`<span class="chip good">pago em dinheiro a ${h(x.moradorNome||"?")}</span>`:`<span class="chip warn">descontado na renda de ${nomeMesCurto(x.mes)} de ${h(x.moradorNome||"?")}</span>`;
  }
  if(x.tipo==="fundo")meta.push(x.sentido==="entrada"?"entrada":"saída");
  const quem=x.criadoPor&&(S.names[x.criadoPor]||x.criadoPorNome);
  if(quem)meta.push("registado por "+h(quem));
  if(x.anulado){const q=x.anuladoPor&&(S.names[x.anuladoPor]||x.anuladoPorNome);chip+=`<span class="chip bad">anulado${q?" por "+h(q):""}</span>`}
  const entrada=x.tipo==="renda"||(x.tipo==="fundo"&&x.sentido==="entrada");
  let acts="";
  const c=S.confirm;
  if(c&&c.id===x.id){
    acts=`<div class="confirm">${c.act==="anular"?"Anular este registo? Continua visível, riscado, e deixa de contar.":"Dar "+eur(x.cent)+" em dinheiro do fundo a "+h(x.moradorNome||"esta pessoa")+"? Deixa de ser descontado na renda de "+nomeMes(x.mes).toLowerCase()+"."}
      <button class="btn small ${c.act==="anular"?"danger":"primary"}" data-act="conf-sim">${c.act==="anular"?"Sim, anular":"Sim, pagar em dinheiro"}</button>
      <button class="btn small" data-act="conf-nao">Cancelar</button></div>`;
  }else if(S.canWrite&&!x.anulado){
    if(gere()&&eBolso(x)&&!x.reembolsado&&x.mes>=addMes(hojeMes(),-1))acts+=`<button class="btn small" data-act="reemb" data-id="${x.id}">Pagar em dinheiro</button>`;
    if((x.tipo==="compra"||x.tipo==="conta")&&podeFotos()&&(gere()||(eMeu(x)&&x.tipo==="compra")))acts+=`<button class="linkbtn" data-act="foto-add" data-alvo="mov:${x.id}">${x.fotos&&x.fotos.length?"Juntar outro talão":"Juntar talão"}</button>`;
    if(podeAnular(x))acts+=`<button class="linkbtn" data-act="anular" data-id="${x.id}">Anular</button>`;
  }
  return `<li class="mov${x.anulado?" anulado":""}">
    <div><div class="mov-desc">${h(descMov(x))}</div><div class="mov-meta">${meta.filter(Boolean).map(m=>`<span>${m}</span>`).join("")}${chip}</div>${fotosMov(x)}</div>
    <div class="mov-val${entrada?" in":""}">${entrada?"+":""}${eur(x.cent)}</div>
    ${acts?`<div class="mov-actions">${acts}</div>`:""}</li>`;
}
function lista(items,vazio,opts){
  if(!items.length)return `<div class="empty">${vazio}</div>`;
  return `<ul class="movs">${items.map(x=>linhaMov(x,opts)).join("")}</ul>`;
}

/* plafond por semana (sexta a quinta): cada dia vale plafond do mês ÷ dias do mês */
const isoDia=dt=>dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate());
function addDias(d,n){const dt=new Date(d+"T12:00:00");dt.setDate(dt.getDate()+n);return isoDia(dt)}
/* dia da semana a contar de sexta (0) até quinta (6) */
const diaDaSemana=d=>(new Date(d+"T12:00:00").getDay()+2)%7;
const inicioSemana=d=>addDias(d,-diaDaSemana(d));
function semanaDe(ini,vis){
  const fim=addDias(ini,6);let orc=0;
  for(let i=0;i<7;i++){const m=addDias(ini,i).slice(0,7);orc+=plafondDe(m)/diasNoMes(m)}
  return {ini,fim,orc:Math.round(orc),gasto:sum(vis.filter(x=>x.tipo==="compra"&&x.data>=ini&&x.data<=fim))};
}
const intervalo=(a,b)=>a.slice(5,7)===b.slice(5,7)?`${+a.slice(8,10)}–${dataCurta(b)}`:`${dataCurta(a)} – ${dataCurta(b)}`;
function estadoSemana(s){const p=s.orc?s.gasto/s.orc:0;return p>1?"bad":p>.85?"warn":"good"}
function cardSemana(m,vis){
  if(!plafondDe(m))return "";
  const hojeD=hoje(),atual=m===hojeMes();
  const semanas=[];for(let ini=inicioSemana(m+"-01");ini<=m+"-"+pad(diasNoMes(m));ini=addDias(ini,7))semanas.push(semanaDe(ini,vis));
  const lista=`<div class="semanas">${semanas.map(s=>{
    const esta=s.ini<=hojeD&&hojeD<=s.fim,futura=s.ini>hojeD,cls=futura?"neutral":estadoSemana(s);
    return `<div class="semana${esta?" atual":""}"><span>${esta?"Esta semana":intervalo(s.ini,s.fim)}</span><b class="num">${eur(s.gasto)}</b><small class="${futura?"muted":""}">de ${eur(s.orc)}</small>${futura?"":`<i class="ponto ${cls}" aria-hidden="true"></i>`}</div>`}).join("")}</div>`;
  if(!atual)return `<div class="card"><div class="eyebrow">Plafond por semana · ${nomeMes(m)}</div>${lista}</div>`;
  const s=semanaDe(inicioSemana(hojeD),vis),resta=s.orc-s.gasto,pct=s.orc?s.gasto/s.orc:0;
  const diaSem=diaDaSemana(hojeD)+1,faltam=7-diaSem+1;
  return `<div class="card hero">
    <div class="eyebrow">Plafond da semana · ${intervalo(s.ini,s.fim)}</div>
    <div class="big med${resta<0?" over":""}">${eur(Math.abs(resta))}<small>${resta>=0?"ainda por gastar esta semana":"acima do plafond da semana"}</small></div>
    <div class="bar" role="img" aria-label="Gasto ${Math.round(pct*100)}% do plafond da semana"><div class="fill ${estadoSemana(s)==="good"?"":estadoSemana(s)}" style="width:${Math.min(100,pct*100).toFixed(1)}%"></div><div class="pace" style="left:calc(${(diaSem/7*100).toFixed(1)}% - 1px)" title="A linha fina marca onde devíamos ir hoje"></div></div>
    <div class="bar-legend"><span>Gasto <b>${eur(s.gasto)}</b> de ${eur(s.orc)}</span>${resta>0?`<span>cerca de <b>${eur(Math.floor(resta/faltam))}</b> por dia até quinta</span>`:""}</div>
    ${lista}</div>`;
}

/* "a minha renda": cada aparelho escolhe uma vez quem é (fica guardado neste aparelho) */
function cardEu(m,vis){
  const pessoas=S.moradores.filter(r=>ativoEm(r,m)).sort((a,b)=>a.nome.localeCompare(b.nome,"pt"));
  if(!pessoas.length)return "";
  const r=S.eu&&S.moradores.find(x=>x.id===S.eu);
  if(!r)return `<div class="card eu-pick"><div><h3>Quem és tu?</h3><div class="hint">Escolhe o teu nome para veres logo quanto tens de pagar. Fica guardado neste aparelho.</div></div>
    <select id="f-eu" aria-label="O teu nome"><option value="">Escolher o meu nome…</option>${pessoas.map(p=>`<option value="${h(p.id)}">${h(p.nome)}</option>`).join("")}</select></div>`;
  const d=rendaDe(r,m,vis),total=rendaTotal(m);
  let corpo;
  if(total==null&&!d.antes&&!d.pago&&!d.desconto)corpo=`<div class="hint">A renda de ${nomeMes(m).toLowerCase()} ainda não foi definida pelo tesoureiro.</div>`;
  else corpo=`<div class="eu-num">
      <div><span>A tua renda</span><b${d.devido<0?' style="color:var(--good)"':""}>${d.devido<0?"−"+eur(-d.devido):eur(d.devido)}</b></div>
      <div><span>Já pagaste</span><b>${eur(d.pago)}</b></div>
      <div><span>${d.aFavor?"A teu favor":"Falta pagar"}</span><b style="color:${d.falta?"var(--bad)":"var(--good)"}">${eur(d.falta||d.aFavor)}</b></div></div>
    ${d.desconto?`<div class="hint">Já tem descontados <b>${eur(d.desconto)}</b> de coisas que pagaste do teu bolso este mês.${d.devido<0?" Como passa do valor da renda, a casa fica a dever-te a diferença.":""} Se precisares do dinheiro, fala com o tesoureiro.</div>`:""}
    ${d.antes?`<div class="hint">Inclui ${d.antes>0?eur(d.antes)+" que ficou por pagar":eur(-d.antes)+" pagos a mais"} em meses anteriores.</div>`:""}`;
  const primeiro=r.nome.split(" ")[0];
  return `<div class="card eu"><div class="section-head"><h2>Olá, ${h(primeiro)}</h2><span class="chip ${d.estado[0]}">${d.estado[1]}</span></div>${corpo}
    <div class="eu-links"><button class="linkbtn" data-act="tab" data-t="rendas">Ver a renda de todos</button><button class="linkbtn" data-act="eu-mudar">Não és ${h(primeiro)}?</button></div></div>`;
}
function escolherEu(id){

}
document.addEventListener("change",e=>{if(e.target.id==="f-eu"&&e.target.value)escolherEu(e.target.value)});

/* ---------- fotos dos talões ---------- */
const TIPOS_FOTO=["image/jpeg","image/png","image/webp","image/gif","application/pdf"];
const srcFoto=f=>"/api/fotos/"+encodeURIComponent(f.id);
const podeFotos=()=>S.canWrite;
function carregarImg(url){return new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=url})}
/* reduz a foto para no máximo 1600px (JPEG) antes de enviar */
async function comprimir(file){
  if(file.type==="application/pdf")return file;
  const url=URL.createObjectURL(file);
  try{
    const img=await carregarImg(url),esc=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement("canvas");cv.width=Math.round(img.naturalWidth*esc);cv.height=Math.round(img.naturalHeight*esc);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    const b=await new Promise(r=>cv.toBlob(r,"image/jpeg",.82));
    if(b&&(b.size<file.size||!TIPOS_FOTO.includes(file.type)))return b;
    if(TIPOS_FOTO.includes(file.type))return file;
  }catch(e){if(TIPOS_FOTO.includes(file.type))return file}
  finally{URL.revokeObjectURL(url)}
  throw {code:"unsupported_type"};
}
async function enviarFotos(files){
  const out=[];
  for(const f of files){
    const b=await comprimir(f),fd=new FormData();
    fd.append("foto",b,b===f?f.name:"talao.jpg");
    const r=await fetch("/api/fotos",{method:"POST",body:fd,credentials:"same-origin"});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw {code:r.status===413?"too_large":r.status===415?"unsupported_type":"erro",message:j.erro};
    out.push({id:j.id,pdf:j.pdf});
  }
  return out;
}
function erroFoto(e){
  const c=e&&e.code;
  toast("err",c==="too_large"?"A foto é grande demais (máximo 12 MB).":c==="unsupported_type"?"Esse ficheiro não dá. Usa uma foto (JPG, PNG) ou um PDF.":c==="quota_or_state"?"Acabou o espaço para fotos desta app.":c==="rate_limited"?"Muitas fotos seguidas. Espera um pouco e tenta outra vez.":"Não foi possível enviar a foto. Tenta outra vez.");
}

/* calculadora da renda: previsão de cada conta + plafond, somada e dividida pelos moradores */
/* linhas da calculadora: [id, nome, categoria de conta ou null, removida] — a comida (plafond) está sempre lá */
function linhasPrev(m){
  const pv=(S.config.previsaoMes||{})[m]||{};
  return [["plafond","Comida (plafond de compras)",null,false]].concat(despesas().filter(d=>!d.removida||pv[d.id]).map(d=>[d.id,d.nome,d.semConta?null:catDe(d),!!d.removida]));
}
function realPrev(k,m,vis){
  if(k==="plafond")return sum(vis.filter(x=>x.tipo==="compra"&&x.mes===m));
  const d=despesas().find(x=>x.id===k);
  if(!d||d.semConta)return null;
  return sum(vis.filter(x=>x.tipo==="conta"&&x.mes===m&&x.categoria===catDe(d)));
}
function previsaoBase(m,vis){
  const pm=S.config.previsaoMes||{};
  if(pm[m])return {v:pm[m],origem:"Previsão guardada para este mês."};
  const ks=Object.keys(pm).filter(k=>k<m).sort();
  if(ks.length){
    const k=ks[ks.length-1],v={plafond:plafondDe(m)};
    despesas().forEach(d=>{if(!d.removida&&pm[k][d.id])v[d.id]=pm[k][d.id]});
    return {v,origem:"Preenchido com a previsão de "+nomeMes(k).toLowerCase()+"."};
  }
  const p=addMes(m,-1),v={plafond:plafondDe(m)};
  despesas().forEach(d=>{if(d.removida||d.semConta)return;const c=realPrev(d.id,p,vis);if(c)v[d.id]=c});
  return {v,origem:Object.keys(v).length>1?"Preenchido com o que se gastou no mês passado.":""};
}

/* ---------- simulação da renda (separador próprio; não grava nada até o tesoureiro aplicar) ---------- */
function somaPrev(v){return Object.values(v||{}).reduce((t,c)=>t+(+c||0),0)}
const receitaMensal=r=>{const c=+r.valor||0;return r.periodo==="anual"?Math.round(c/12):c};
const receitasTotal=rs=>rs.reduce((t,r)=>t+receitaMensal(r),0);
function iniciarSim(m){
  const v=Object.assign({},previsaoBase(m,vivos()).v),rt=rendaTotal(m),dif=rt!=null?rt-somaPrev(v):0;
  if(dif>0)v.outra=(v.outra||0)+dif; /* renda definida à mão sem previsão: a diferença entra em "outras contas" */
  const extras=[];
  S.sim={mes:m,auto:true,arred:regraDe(m).arredondar,v,linhasCom:regraDe(m).linhas.slice(),extras,
    receitas:(S.config.receitas||[]).map(r=>({nome:r.nome||"",valor:+r.valor||0,periodo:r.periodo==="anual"?"anual":"mensal"})),
    fix:{},val:null,base:{},T:0,G:0};
  recalcSim(true);
}
/* linhas de gastos da simulação: as da calculadora + as que se juntaram aqui */
function linhasSim(){
  const s=S.sim,base=linhasPrev(s.mes).map(([k,l])=>({k,l})),ks=new Set(base.map(x=>x.k));
  const extra=new Set(s.extras.map(e=>e.k));
  Object.keys(s.v).forEach(k=>{if(!ks.has(k)&&!extra.has(k)){const d=despesas().find(x=>x.id===k);base.push({k,l:d?d.nome:k});ks.add(k)}});
  return base.concat(s.extras.filter(e=>!ks.has(e.k)).map(e=>({k:e.k,l:e.nome,extra:true})));
}
function pessoasSim(m){return S.moradores.filter(r=>ativoEm(r,m)).sort((a,b)=>a.nome.localeCompare(b.nome,"pt"))}
function recalcSim(repor){
  const s=S.sim,m=s.mes;
  s.G=somaPrev(s.v);
  s.T=Math.max(0,s.G-receitasTotal(s.receitas));
  const regra=Object.assign(regraDe(m),{ajustes:{},arredondar:s.arred,linhas:s.linhasCom});
  s.base=s.T?divisao(s.T,s.v,m,regra).out:{};
  if(repor||!s.val){s.val=Object.assign({},s.base);s.fix={}}
  else if(s.auto)redistribuir();
}
/* com "ajustar automaticamente": quem não foi mexido divide o que falta, na proporção da sua parte normal */
function redistribuir(){
  const s=S.sim,ids=pessoasSim(s.mes).map(r=>r.id);
  const fixos=ids.filter(id=>s.fix[id]),livres=ids.filter(id=>!s.fix[id]);
  const resto=s.T-fixos.reduce((t,id)=>t+(s.val[id]||0),0);
  livres.forEach(id=>{s.val[id]=0});
  if(resto>0&&livres.length){
    const tmp={},soma=livres.reduce((t,id)=>t+(s.base[id]||0),0);
    dividirPeso(resto,livres.map(id=>({id,w:soma?(s.base[id]||0):1})),tmp);
    livres.forEach(id=>{s.val[id]=s.arred?Math.ceil(((tmp[id]||0)-1e-6)/100)*100:(tmp[id]||0)});
  }
}
function resumoSim(){
  const s=S.sim,ids=pessoasSim(s.mes).map(r=>r.id),total=ids.reduce((t,id)=>t+(s.val[id]||0),0),R=receitasTotal(s.receitas),dif=total-s.T;

function tSimulacao(){

  return `<div class="card"><div class="section-head"><div><div class="eyebrow">Simulação · ${nomeMes(m)}</div><h2>E se…?</h2></div><button class="btn small" data-act="sim-repor">Recomeçar</button></div>

/* atualiza os números no ecrã sem redesenhar (para não perder o que se está a escrever) */
function atualizarSimDOM(){
  const s=S.sim;if(!s)return;
  const ativo=document.activeElement;
  document.querySelectorAll(".sim-val").forEach(el=>{if(el!==ativo)el.value=eurNum(s.val[el.dataset.id]||0)});
  document.querySelectorAll(".sim-normal").forEach(el=>{el.textContent="normal "+eur(s.base[el.dataset.id]||0)});
  const g=document.getElementById("sim-g-total");if(g)g.textContent=eur(s.G);
  const rt=document.getElementById("sim-r-total"),R=receitasTotal(s.receitas);if(rt)rt.textContent=R?"−"+eur(R):eur(0);
  const r=document.getElementById("sim-resumo");if(r)r.innerHTML=resumoSim();
}
document.addEventListener("change",e=>{
  const t=e.target;if(!S.sim||S.tab!=="simulacao")return;
  if(t.classList&&t.classList.contains("sim-val")){
    const x=t.value.trim(),c=x===""||x==="0"||x==="0,00"?0:parseValor(x);
    if(c==null){toast("err","Escreve um valor, por exemplo 180");t.value=eurNum(S.sim.val[t.dataset.id]||0);return}
    S.sim.val[t.dataset.id]=c;S.sim.fix[t.dataset.id]=true;
    if(S.sim.auto)redistribuir();
    return render();
  }
  if(t.classList&&t.classList.contains("sim-gc")){
    const k=t.dataset.k;S.sim.linhasCom=S.sim.linhasCom.filter(x=>x!==k);if(t.checked)S.sim.linhasCom.push(k);
    recalcSim(false);return atualizarSimDOM();
  }
  if(t.classList&&t.classList.contains("sim-r")&&t.tagName==="SELECT"){const r=S.sim.receitas[+t.dataset.i];if(r){r.periodo=t.value;recalcSim(false);atualizarSimDOM()}return}
  if(t.id==="sim-auto"){S.sim.auto=t.checked;if(t.checked)redistribuir();return render()}
  if(t.id==="sim-arred"){S.sim.arred=t.checked;recalcSim(!Object.keys(S.sim.fix).length);return render()}
});
document.addEventListener("input",e=>{
  const t=e.target;if(!S.sim||!t.classList)return;
  if(t.classList.contains("sim-g")){const x=t.value.trim();S.sim.v[t.dataset.k]=x?(parseValor(x)||0):0;recalcSim(false);return atualizarSimDOM()}
  if(t.classList.contains("sim-r")&&t.tagName!=="SELECT"){
    const r=S.sim.receitas[+t.dataset.i];if(!r)return;
    if(t.dataset.c==="valor"){const x=t.value.trim();r.valor=x?(parseValor(x)||0):0}else r[t.dataset.c]=t.value;
    recalcSim(false);atualizarSimDOM();
  }
});
async function aplicarSim(){
  const s=S.sim,m=s.mes;
  const v={};Object.keys(s.v).forEach(k=>{if(s.v[k])v[k]=s.v[k]});
  const lista=despesas().map(d=>Object.assign({},d));
  s.extras.forEach(e=>{if(v[e.k]&&!lista.some(d=>d.id===e.k))lista.push({id:e.k,nome:e.nome})});
  lista.forEach(d=>{if(v[d.id]&&d.removida)delete d.removida});
  const previsaoMes=Object.assign({},S.config.previsaoMes||{});previsaoMes[m]=v;
  const rendaMes=Object.assign({},S.config.rendaMes||{});rendaMes[m]=s.T;
  const divisaoMes=Object.assign({},S.config.divisaoMes||{});divisaoMes[m]=Object.assign(regraAtual(),{linhas:s.linhasCom.slice(),arredondar:s.arred});
  const aj=JSON.parse(JSON.stringify(S.config.ajustesMes||{}));delete aj[m];
  const mudados={};pessoasSim(m).forEach(r=>{if((s.val[r.id]||0)!==(s.base[r.id]||0))mudados[r.id]=s.val[r.id]||0});
  if(Object.keys(mudados).length)aj[m]=mudados;
  const receitas=s.receitas.filter(r=>r.nome.trim()||r.valor).map(r=>({nome:r.nome.trim().slice(0,60),valor:r.valor,periodo:r.periodo}));
  const p={previsaoMes,rendaMes,divisaoMes,ajustesMes:aj,receitas,despesas:lista,comensalLinhas:s.linhasCom.slice(),arredondarRenda:!!s.arred,anoInicio:S.config.anoInicio||+hojeMes().slice(0,4)};
  if(v.plafond!=null&&v.plafond!==plafondDe(m)){const pm=Object.assign({},S.config.plafondMes||{});pm[m]=v.plafond;p.plafondMes=pm}
  if(await gravar(()=>guardarConfig(p))){S.sim=null;toast("ok","Simulação aplicada a "+nomeMes(m).toLowerCase())}
}

function tHistorico(){
  const all=allMovs(),vis=vivos(),cur=hojeMes();
  let min=S.config.anoInicio?S.config.anoInicio+"-01":cur,max=cur;
  all.forEach(x=>{if(x.mes<min)min=x.mes;if(x.mes>max)max=x.mes});
  const primeiro=all.length?all.reduce((a,x)=>x.mes<a?x.mes:a,cur):cur;
  if(min<primeiro)min=primeiro;
  if(S.moradores.length){const e=S.moradores.reduce((a,r)=>r.entrada&&r.entrada<a?r.entrada:a,min);if(e<min)min=e}
  const meses=[];for(let m=max;m>=min;m=addMes(m,-1))meses.push(m);
  const rows=meses.map(m=>{const st=stats(m,vis),resta=st.plafond-st.compras;
    return `<tr class="clickable${m===S.mes?" sel":""}" data-act="ir-mes" data-m="${m}"><td><b>${nomeMes(m)}</b></td><td class="r num">${eur(st.plafond)}</td><td class="r num">${eur(st.compras)}</td><td class="r num" ${resta<0?'style="color:var(--bad)"':""}>${eur(resta)}</td><td class="r num">${eur(st.contas)}</td><td class="r num">${eur(st.rendasRec)} <span class="muted">/ ${eur(st.rendasEsp)}</span></td><td class="r num">${eur(st.saldo)}</td></tr>`}).join("");
  const exp=true?`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" data-act="exportar" data-q="mes">Exportar ${nomeMesCurto(S.mes)} (CSV)</button><button class="btn small" data-act="exportar" data-q="tudo">Exportar tudo (CSV)</button></div>`:"";

}

function pessoasCard(){
  const m=S.mes,tes=gere(),todos=S.moradores.slice().sort((a,b)=>(a.saida?1:0)-(b.saida?1:0)||a.nome.localeCompare(b.nome,"pt"));
  const usados=new Set(allMovs().map(x=>x.morador).filter(Boolean));
  const linhas=todos.map(r=>{
    const com=eComensal(r);
    if(tes&&S.editMorador===r.id)return `<div class="membro edit"><form data-form="morador-edit" data-id="${h(r.id)}" class="grid" autocomplete="off">
      <label class="fld"><span>Nome</span><input id="f-e-nome" maxlength="80" value="${h(r.nome)}"></label>
      <label class="fld"><span>Tipo</span><select id="f-e-tipo">${OPC_TIPO.map(([t,l])=>`<option value="${t}"${t===r.tipo?" selected":""}>${l}</option>`).join("")}</select></label>
      <label class="fld"><span>Valor fixo por mês (comensais e meios)</span><input id="f-e-fixo" inputmode="decimal" placeholder="Vazio = paga a sua parte" value="${r.valorFixo!=null?eurNum(r.valorFixo):""}"></label>
      <label class="fld"><span>Na casa desde</span><select id="f-e-entrada">${optsMesesTodos(r.entrada||m,"")}</select></label>
      <label class="fld"><span>Saiu no fim de</span><select id="f-e-saida">${optsMesesTodos(r.saida||"","Ainda cá está")}</select></label>
      <div class="form-foot fld wide">${btnGuardar("Guardar")}<button type="button" class="btn" data-act="morador-fechar">Cancelar</button><span class="hint">O tipo e o valor fixo contam a partir de ${nomeMes(m).toLowerCase()}, o mês que estás a ver.</span></div></form></div>`;
    let acts="";
    if(tes){
      const c=S.confirm;
      acts=c&&c.act==="apagar-morador"&&c.id===r.id
        ?`<span class="confirm">Apagar ${h(r.nome)}? <button class="btn small danger" data-act="conf-sim">Apagar</button><button class="btn small" data-act="conf-nao">Cancelar</button></span>`
        :`<button class="btn small" data-act="morador-editar" data-id="${h(r.id)}">Editar</button>${usados.has(r.id)?"":`<button class="linkbtn" data-act="apagar-morador" data-id="${h(r.id)}" style="color:var(--bad)">Apagar</button>`}`;
    }
    return `<div class="membro"><div class="membro-topo">${avatar(r)}<div class="membro-nome"><b>${h(r.nome)}</b><div class="membro-chips"><span class="chip ${com?"neutral":"good"}">${nomeTipo(r)}${com&&r.valorFixo!=null?" · fixo "+eur(r.valorFixo):""}</span><span class="muted">${r.entrada?"desde "+nomeMesCurto(r.entrada):""}${r.saida?" · saiu no fim de "+nomeMesCurto(r.saida):""}</span></div></div>${acts}</div></div>`;
  }).join("");
  const add=tes?`<form data-form="morador" class="grid" style="align-items:end;margin-top:14px" autocomplete="off">
      <label class="fld"><span>Nome</span><input id="f-m-nome" maxlength="80" placeholder="Nome" required></label>
      <label class="fld"><span>Tipo</span><select id="f-m-tipo">${OPC_TIPO.map(([t,l])=>`<option value="${t}">${l}</option>`).join("")}</select></label>
      <label class="fld"><span>Valor fixo por mês (comensais e meios)</span><input id="f-m-fixo" inputmode="decimal" placeholder="Vazio = paga a sua parte"></label>
      <label class="fld"><span>Na casa desde</span><select id="f-m-entrada">${optsMeses(m)}</select></label>
      <div>${btnGuardar("Adicionar pessoa")}</div></form>`:"";
  return `<div class="card"><div class="section-head"><h2>Pessoas da casa</h2><span class="hint">Moradores pagam a renda toda. Comensais pagam a sua parte das despesas marcadas na calculadora da renda (ou um valor fixo); meios comensais pagam metade de um comensal.${tes?" Quem sai da casa: edita e marca o mês em que saiu, para o histórico não mudar.":""}</span></div>
    ${todos.length?`<div class="membros">${linhas}</div>`:'<div class="empty">Ainda não há pessoas registadas.</div>'}${add}</div>`;
}
function tesoureirosCard(){
  const tes=gere(),lista=S.tesoureiros.slice().sort((a,b)=>a.nome.localeCompare(b.nome,"pt"));
  const pend=lista.filter(u=>u.estado==="pendente"),ativos=lista.filter(u=>u.estado==="ativo"),bloq=lista.filter(u=>u.estado==="bloqueado");
  const linha=u=>{
    let acts="";
    if(tes){
      const c=S.confirm,aConfirmar=c&&c.id===u.id&&(c.act==="tes-recusar"||c.act==="tes-retirar");
      if(aConfirmar)acts=`<span class="confirm">${c.act==="tes-recusar"?"Recusar o pedido de "+h(u.nome)+"?":"Tirar "+h(u.nome)+" de tesoureiro?"} <button class="btn small danger" data-act="conf-sim">Sim</button><button class="btn small" data-act="conf-nao">Cancelar</button></span>`;
      else if(u.estado==="pendente")acts=`<button class="btn small primary" data-act="tes-aprovar" data-id="${h(u.id)}">Aprovar</button><button class="btn small danger" data-act="tes-recusar" data-id="${h(u.id)}">Recusar</button>`;
      else if(u.estado==="ativo"&&ativos.length>1)acts=`<button class="linkbtn" data-act="tes-retirar" data-id="${h(u.id)}" style="color:var(--bad)">${S.me&&u.id===S.me.id?"Deixar de ser tesoureiro":"Tirar de tesoureiro"}</button>`;
      else if(u.estado==="bloqueado")acts=`<button class="linkbtn" data-act="tes-aprovar" data-id="${h(u.id)}">Voltar a aprovar</button>`;
    }
    return `<div class="membro"><div class="membro-topo">${avatar(u)}<div class="membro-nome"><b>${h(u.nome)}${S.me&&u.id===S.me.id?' <span class="muted">(tu)</span>':""}</b>${tes&&u.email?`<span class="muted">${h(u.email)}</span>`:""}</div>${acts}</div></div>`;
  };
  return `<div class="card"><div class="section-head"><h2>Tesoureiros</h2><span class="hint">Os tesoureiros entram com a conta Google e gerem contas, rendas, fundo e definições. Um tesoureiro novo fica à espera até outro tesoureiro o aprovar.</span></div>
    ${tes&&pend.length?`<h3 class="sub-h">À espera de aprovação (${pend.length})</h3><div class="membros">${pend.map(linha).join("")}</div><h3 class="sub-h">Tesoureiros</h3>`:""}
    <div class="membros">${ativos.map(linha).join("")||'<div class="empty">Ainda não há tesoureiros. Quem entrar primeiro fica logo tesoureiro.</div>'}</div>
    ${tes&&bloq.length?`<h3 class="sub-h">Retirados (${bloq.length})</h3><div class="membros">${bloq.map(linha).join("")}</div>`:""}
    ${!S.me?'<div class="form-foot"><button class="btn" data-act="entrar">Entrar como tesoureiro</button></div>':""}
    ${tes?'<div class="form-foot"><a class="btn small" href="/api/copia-seguranca">Descarregar cópia de segurança</a><span class="hint">Tem todos os registos; as fotos dos talões estão na pasta <code>dados/fotos</code> do servidor.</span></div>':""}
    ${tes&&!S.moradores.length&&!allMovs().length?'<div class="form-foot"><button class="btn small" data-act="importar">Importar dados (.json)</button><span class="hint">Para trazer os dados de outra Caixa da Casa (por exemplo, da versão que estava no Claude). Só funciona com a app ainda vazia.</span></div>':""}</div>`;
}

let toastT=0;
function toast(t,txt){const el=document.getElementById("toast");el.className="toast "+t;el.textContent=txt;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},3800)}
function falhou(e){
  const st=e&&e.status;
  if(st===401){toast("err","A tua sessão terminou. Entra outra vez.");setTimeout(()=>location.reload(),1500)}
  else if(st===403)toast("err",(e&&e.message)||"Não tens permissão para fazer isto.");
  else toast("err",(e&&e.message)||"Não foi possível gravar. Verifica a ligação e tenta outra vez.");
  schedule();
}
async function api(metodo,url,corpo){
  const r=await fetch(url,{method:metodo,credentials:"same-origin",headers:corpo?{"Content-Type":"application/json"}:{},body:corpo?JSON.stringify(corpo):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw {status:r.status,message:j.erro};
  return j;
}
async function gravar(fn){
  if(S.saving)return false;
  S.saving=true;schedule();
  try{await fn();await carregar();return true}
  catch(e){falhou(e);return false}
  finally{S.saving=false;schedule()}
}
function addMov(mov){return gravar(()=>api("POST","/api/movimentos",mov))}
function patchMov(x,p){return gravar(()=>api("PATCH","/api/movimentos/"+encodeURIComponent(x.id),p))}
function guardarConfig(p){return api("PUT","/api/config",p)}

    const id=form.dataset.id,cent=parseValor(val("f-r-valor"));if(!cent)return toast("err","Escreve o valor pago");
    const data=val("f-r-data")||hoje();

    const cent=parseValor(val("f-t-total"));if(!cent)return toast("err","Escreve o valor total da renda, por exemplo 950");
    const rendaMes=Object.assign({},S.config.rendaMes||{});rendaMes[S.mes]=cent;
    const divisaoMes=Object.assign({},S.config.divisaoMes||{});divisaoMes[S.mes]=Object.assign(regraAtual(),{linhas:regraDe(S.mes).linhas,arredondar:regraDe(S.mes).arredondar});
    const p={rendaMes,divisaoMes,anoInicio:S.config.anoInicio||+hojeMes().slice(0,4)};
    const ok=await gravar(()=>guardarConfig(p),()=>Object.assign(S.config,p));
    if(ok){S.reset="f-t-";toast("ok","Renda de "+nomeMes(S.mes)+" guardada")}
  },
  async previsao(){
    if(document.activeElement&&document.activeElement.id==="f-d-nome")return addDespesa();
    const {v,t:total,mau,regra}=lerPrev();
    if(mau)return toast("err","O valor de «"+mau+"» não é válido");
    if(!total)return toast("err","Põe pelo menos um valor previsto");
    const m=S.mes,previsaoMes=Object.assign({},S.config.previsaoMes||{}),rendaMes=Object.assign({},S.config.rendaMes||{});
    previsaoMes[m]=v;rendaMes[m]=total;
    const divisaoMes=Object.assign({},S.config.divisaoMes||{});divisaoMes[m]=regra;

    if(v.plafond!=null&&v.plafond!==plafondDe(m)){const pm=Object.assign({},S.config.plafondMes||{});pm[m]=v.plafond;p.plafondMes=pm}
    const ok=await gravar(()=>guardarConfig(p),()=>Object.assign(S.config,p));
    if(ok){S.reset="f-p";S.reset2="f-t-";toast("ok","Renda de "+nomeMes(m)+" guardada: "+eur(total))}
  },
  async ajuste(form){
    const id=form.dataset.id,x=val("f-a-valor").trim(),cent=x==="0"||x==="0,00"?0:parseValor(x);
    if(cent==null)return toast("err","Escreve o valor, por exemplo 150");
    const aj=JSON.parse(JSON.stringify(S.config.ajustesMes||{}));(aj[S.mes]=aj[S.mes]||{})[id]=cent;
    const ok=await gravar(()=>guardarConfig({ajustesMes:aj}),()=>{S.config.ajustesMes=aj});
    if(ok){S.ajusteEdit=null;toast("ok",nomeMorador(id)+" paga "+eur(cent)+" em "+nomeMes(S.mes).toLowerCase()+"; a renda total do mês foi ajustada")}
  },
  async fundo(){
    const cent=parseValor(val("f-f-valor"));if(!cent)return toast("err","Escreve o valor");
    const desc=val("f-f-desc").trim();if(!desc)return toast("err","Escreve uma descrição, para todos perceberem o movimento");
    const data=val("f-f-data");if(!data)return toast("err","Escolhe a data");
    const ok=await addMov({tipo:"fundo",mes:data.slice(0,7),data,cent,sentido:val("f-f-sentido"),descricao:desc});
    if(ok){S.reset="f-f-";toast("ok","Movimento guardado")}
  },
  async config(){
    const pl=val("f-s-plafond").trim(),plm=val("f-s-plafondmes").trim(),ini=val("f-s-inicial").trim();
    const plafond=pl===""||pl==="0"?0:parseValor(pl);if(plafond==null)return toast("err","O plafond mensal tem de ser um valor, por exemplo 400");
    let plafondMes=Object.assign({},S.config.plafondMes||{});
    if(plm===""){delete plafondMes[S.mes]}else{const v=plm==="0"?0:parseValor(plm);if(v==null)return toast("err","O plafond do mês tem de ser um valor, ou fica vazio");plafondMes[S.mes]=v}
    let fundoInicial=0;if(ini!==""&&ini!=="0"){const neg=ini.startsWith("-");const v=parseValor(ini.replace(/^-/,""));if(v==null)return toast("err","O saldo inicial tem de ser um valor");fundoInicial=neg?-v:v}
    const p={nome:val("f-s-nome").trim()||DEF.nome,plafond,plafondMes,fundoInicial,rendasNoFundo:document.getElementById("f-s-rendas").checked,anoInicio:S.config.anoInicio||+hojeMes().slice(0,4)};
    const ok=await gravar(()=>guardarConfig(p),()=>Object.assign(S.config,p));
    if(ok){S.reset="f-s-";S.fresh=true;toast("ok","Definições guardadas")}
  },
  "sim-gasto"(){
    const nome=val("sim-novo-nome").trim().replace(/\s+/g," ");if(!nome)return toast("err","Escreve o nome do gasto");
    const x=val("sim-novo-valor").trim(),c=x?parseValor(x):0;if(x&&c==null)return toast("err","Escreve um valor, por exemplo 50");
    const k=(nome.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,20)||"gasto")+"-"+Math.random().toString(36).slice(2,6);
    S.sim.extras.push({k,nome});S.sim.v[k]=c||0;recalcSim(false);render();
    const el=document.getElementById("sim-novo-nome");if(el){el.value="";document.getElementById("sim-novo-valor").value=""}
  },
  async dev(){
    try{await api("POST","/api/entrar/dev",{email:val("d-email"),nome:val("d-nome")});location.reload()}
    catch(e){toast("err",e.message||"Não deu para entrar")}
  },
  async morador(){
    const nome=val("f-m-nome").trim();if(!nome)return toast("err","Escreve o nome");
    const tipo=val("f-m-tipo"),fx=val("f-m-fixo").trim(),com=tipo==="comensal"||tipo==="meio";
    let valorFixo=null;if(com&&fx!==""){valorFixo=fx==="0"||fx==="0,00"?0:parseValor(fx);if(valorFixo==null)return toast("err","O valor fixo tem de ser um valor, por exemplo 60")}
    const entrada=val("f-m-entrada")||S.mes;
    let novo=null;
    const ok=await gravar(async()=>{
      novo=await api("POST","/api/pessoas",{nome,tipo,valorFixo,entrada,saida:null});
      /* meses com a regra já guardada a partir da entrada: a pessoa nova entra nessa regra */
      const dm=JSON.parse(JSON.stringify(S.config.divisaoMes||{}));let mudou=false;
      Object.keys(dm).forEach(k=>{if(k<entrada)return;const d=dm[k];
        if(com){d.comensais=(d.comensais||[]).concat([novo.id]);if(tipo==="meio")d.meios=(d.meios||[]).concat([novo.id]);if(valorFixo!=null){d.fixos=d.fixos||{};d.fixos[novo.id]=valorFixo}}
        if(d.pessoas)d.pessoas.push(novo.id);mudou=true});
      if(mudou)await guardarConfig({divisaoMes:dm});
    });
    if(ok){S.reset="f-m-";toast("ok",nome+" adicionado")}
  },
  async "morador-edit"(form){
    const id=form.dataset.id,r=S.moradores.find(x=>x.id===id);if(!r)return;
    const nome=val("f-e-nome").trim();if(!nome)return toast("err","Escreve o nome");
    const tipo=val("f-e-tipo"),fx=val("f-e-fixo").trim(),com=tipo==="comensal"||tipo==="meio";
    let valorFixo=null;if(com&&fx!==""){valorFixo=fx==="0"||fx==="0,00"?0:parseValor(fx);if(valorFixo==null)return toast("err","O valor fixo tem de ser um valor, por exemplo 60")}
    const entrada=val("f-e-entrada")||null,saida=val("f-e-saida")||null;
    if(entrada&&saida&&saida<entrada)return toast("err","O mês de saída não pode ser antes do mês de entrada");
    /* a regra de divisão já guardada muda só a partir do mês que estás a ver */
    const dm=JSON.parse(JSON.stringify(S.config.divisaoMes||{}));let mudou=false;
    if(tipo!==r.tipo||valorFixo!==r.valorFixo)Object.keys(dm).forEach(k=>{if(k<S.mes)return;const d=dm[k];
      d.comensais=(d.comensais||[]).filter(x=>x!==id);d.meios=(d.meios||[]).filter(x=>x!==id);d.fixos=d.fixos||{};delete d.fixos[id];
      if(com){d.comensais.push(id);if(tipo==="meio")d.meios.push(id);if(valorFixo!=null)d.fixos[id]=valorFixo}
      mudou=true});
    const ok=await gravar(async()=>{await api("PATCH","/api/pessoas/"+encodeURIComponent(id),{nome,tipo,valorFixo,entrada,saida});if(mudou)await guardarConfig({divisaoMes:dm})});
    if(ok){S.editMorador=null;toast("ok",mudou?"Guardado. Conta a partir de "+nomeMes(S.mes).toLowerCase():"Guardado")}
  }
};
document.addEventListener("submit",e=>{const f=e.target.closest("form[data-form]");if(!f)return;e.preventDefault();if(SO_TES_FORMS.includes(f.dataset.form)&&!gere())return semPermissao();const fn=handlers[f.dataset.form];if(fn)fn(f)});

async function addDespesa(){
  const nome=val("f-d-nome").trim().replace(/\s+/g," ");if(!nome)return toast("err","Escreve o nome da despesa");
  const lista=despesas().map(d=>Object.assign({},d)),igual=lista.find(d=>d.nome.toLowerCase()===nome.toLowerCase()||catDe(d).toLowerCase()===nome.toLowerCase());
  if(igual&&!igual.removida)return toast("err","Já existe a despesa «"+igual.nome+"»");
  if(igual)delete igual.removida;
  else{const slug=nome.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,20)||"despesa";lista.push({id:slug+"-"+Math.random().toString(36).slice(2,6),nome})}
  if(await gravar(()=>guardarConfig({despesas:lista}),()=>{S.config.despesas=lista})){S.reset="f-d-";toast("ok","Despesa «"+nome+"» adicionada")}
}
